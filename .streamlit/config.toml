# Arayüz teması — notebook'taki grafiklerle aynı renk paletini kullanır.
# Böylece uygulama, kullanıcının Streamlit tema tercihinden bağımsız olarak
# her zaman aynı görünür.

[theme]
base = "light"
primaryColor = "#2a78d6"            # kategorik slot 1 (mavi)
backgroundColor = "#fcfcfb"         # açık yüzey
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"               # birincil mürekkep
font = "sans serif"

[browser]
gatherUsageStats = false
